<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ИЗОСИНТ</title>

    <link rel="icon" type="image/x-icon" href="images/icon.svg" />

    <link rel="stylesheet" href="./stylesheets/style.css" />

    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>

    <script src="./script.js" defer></script>
  </head>

  <body>
    <img class="x-up-right" src="./images/x.svg" alt="x" />
    <img class="x-up-left" src="./images/x.svg" alt="x" />

    <h1 class="header">ИЗОСИНТ</h1>

    <section class="pressure" id="pressure">
      <h1 class="number">01</h1>
      <h1 class="name">ATM.PERS.</h1>

      <h2 class="description">
        МОДУЛЬ АТМОСФЕРНОГО<br />
        ДАВЛЕНИЯ
      </h2>

      <button id="play1" class="button-start">
        <img
          class="button-start-icon"
          src="./images/start-black.svg"
          alt="start"
        />
      </button>

      <button id="stop1" class="button-stop">
        <img
          class="button-start-icon"
          src="./images/stop-black.svg"
          alt="stop"
        />
      </button>

      <button class="button-wv-1">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">WV.01</h1>
      </button>

      <button class="button-wv-2">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">WV.02</h1>
      </button>

      <button class="button-wv-3">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">[ + ]</h1>
      </button>

      <button class="button-wv-4">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">[ - ]</h1>
      </button>

      <button class="button-echo">
        <h2 class="button-echo-text">НАЛИЧИЕ: <br />//эхо</h2>
      </button>

      <button class="button-turbulence">
        <h2 class="button-turbulence-text">НАЛИЧИЕ: <br />//турбулентность</h2>
      </button>
    </section>

    <section class="wind" id="wind">
      <h1 class="number">02</h1>
      <h1 class="name">WIND.</h1>

      <h2 class="description">
        МОДУЛЬ ВОЗДУШНОГО<br />
        ПОТОКА
      </h2>

      <button id="play2" class="button-start">
        <img
          class="button-start-icon"
          src="./images/start-black.svg"
          alt="start"
        />
      </button>

      <button id="stop2" class="button-stop">
        <img
          class="button-start-icon"
          src="./images/stop-black.svg"
          alt="stop"
        />
      </button>

      <button class="button-wv-1">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">WV.01</h1>
      </button>

      <button class="button-wv-2">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">WV.02</h1>
      </button>

      <button class="button-wv-3">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">[ + ]</h1>
      </button>

      <button class="button-wv-4">
        <img class="button-wv-icon" src="./images/wv-black.svg" alt="wv" />
        <h1 class="button-wv-text">[ - ]</h1>
      </button>

      <button class="button-pulse">
        <h2 class="button-pulse-text">НАЛИЧИЕ: <br />//импульс</h2>
      </button>

      <button class="button-space">
        <h2 class="button-space-text">НАЛИЧИЕ: <br />//пространство</h2>
      </button>
    </section>

    <section class="precipitation" id="precipitation">
      <h1 class="number">03</h1>
      <h1 class="name">PRC.</h1>

      <h2 class="description">МОДУЛЬ ОСАДКОВ</h2>

      <button id="play3" class="button-start">
        <img
          class="button-start-icon"
          src="./images/start-black.svg"
          alt="start"
        />
      </button>

      <button id="stop3" class="button-stop">
        <img
          class="button-start-icon"
          src="./images/stop-black.svg"
          alt="stop"
        />
      </button>

      <div class="prc-sequencer">
        <div class="prc-row" data-instrument="thunder">
          <span class="prc-label">ГРОМ</span>

          <div class="prc-steps">
            <button class="prc-step" aria-label="Гром, шаг 1"></button>
            <button class="prc-step" aria-label="Гром, шаг 2"></button>
            <button class="prc-step" aria-label="Гром, шаг 3"></button>
            <button class="prc-step" aria-label="Гром, шаг 4"></button>
            <button class="prc-step" aria-label="Гром, шаг 5"></button>
            <button class="prc-step" aria-label="Гром, шаг 6"></button>
            <button class="prc-step" aria-label="Гром, шаг 7"></button>
            <button class="prc-step" aria-label="Гром, шаг 8"></button>
          </div>
        </div>

        <div class="prc-row" data-instrument="lightning">
          <span class="prc-label">МОЛНИЯ</span>

          <div class="prc-steps">
            <button class="prc-step" aria-label="Молния, шаг 1"></button>
            <button class="prc-step" aria-label="Молния, шаг 2"></button>
            <button class="prc-step" aria-label="Молния, шаг 3"></button>
            <button class="prc-step" aria-label="Молния, шаг 4"></button>
            <button class="prc-step" aria-label="Молния, шаг 5"></button>
            <button class="prc-step" aria-label="Молния, шаг 6"></button>
            <button class="prc-step" aria-label="Молния, шаг 7"></button>
            <button class="prc-step" aria-label="Молния, шаг 8"></button>
          </div>
        </div>

        <div class="prc-row" data-instrument="rain">
          <span class="prc-label">ДОЖДЬ</span>

          <div class="prc-steps">
            <button class="prc-step" aria-label="Дождь, шаг 1"></button>
            <button class="prc-step" aria-label="Дождь, шаг 2"></button>
            <button class="prc-step" aria-label="Дождь, шаг 3"></button>
            <button class="prc-step" aria-label="Дождь, шаг 4"></button>
            <button class="prc-step" aria-label="Дождь, шаг 5"></button>
            <button class="prc-step" aria-label="Дождь, шаг 6"></button>
            <button class="prc-step" aria-label="Дождь, шаг 7"></button>
            <button class="prc-step" aria-label="Дождь, шаг 8"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="forth_block" id="forth_block"></section>

    <img class="x-down-right" src="./images/x.svg" alt="x" />
    <img class="x-down-left" src="./images/x.svg" alt="x" />
  </body>
</html>
